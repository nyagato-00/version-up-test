name: Auto Version Up

on:
  schedule:
    # 毎週月曜〜金曜の午前9時(UTC 0時)に実行
    - cron: "0 0 * * 1-5"

  # 手動実行用
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Define branch name
        id: branch-name
        run: echo "branch_name=auto_versionup" >> $GITHUB_OUTPUT

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch and checkout develop
        run: |
          git fetch origin develop
          git checkout develop
          git pull origin develop

      - name: Create version up branch
        run: git checkout -b ${{ steps.branch-name.outputs.branch_name }}

      - name: Version up
        id: version-up
        run: |
          # 現在のバージョンを取得
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          # バージョンアップを実行
          npm version minor
          
          # 新しいバージョンを取得
          NEW_VERSION=$(node -p "require('./package.json').version")
          
          # 出力を設定
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Push changes
        run: |
          git push --force origin ${{ steps.branch-name.outputs.branch_name }}

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head ${{ steps.branch-name.outputs.branch_name }} \
            --title "Version Up to v${{ steps.version-up.outputs.new_version }}" \
            --body "## 自動バージョンアップPR

          現在のバージョン: v${{ steps.version-up.outputs.current_version }}
          新しいバージョン: v${{ steps.version-up.outputs.new_version }}

          ### 変更内容
          - \`npm version minor\` を実行
          - \`package.json\` を更新

          ### 注意事項
          - このPRはGitHub Actionsによって自動生成されています
          - マージ前に依存関係に問題がないか確認してください"
