name: Auto Version Up

on:
  schedule:
    # 毎週月曜〜金曜の午前9時(UTC 0時)に実行
    - cron: "25 1 * * 1-5"

  # 手動実行用
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Version up
        id: version-up
        run: |
          # 現在のバージョンを取得
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          
          # バージョンアップを実行
          npm version minor
          
          # 新しいバージョンを取得
          NEW_VERSION=$(node -p "require('./package.json').version")
          
          # 出力を設定
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to v${{ steps.version-up.outputs.new_version }}"
          branch: auto_versionup
          base: develop
          delete-branch: false
          title: "Version Up to v${{ steps.version-up.outputs.new_version }}"
          add-paths: |
            package.json
            package-lock.json
          body: |
            ## 自動バージョンアップPR
            
            現在のバージョン: v${{ steps.version-up.outputs.current_version }}
            新しいバージョン: v${{ steps.version-up.outputs.new_version }}
            
            ### 変更内容
            - `npm version minor` を実行
            - `package.json` を更新
            
            ### 注意事項
            - このPRはGitHub Actionsによって自動生成されています
            - マージ前に依存関係に問題がないか確認してください
